<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b13"><title>Pranugget Hunt V2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1711;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#08130beF,#213a23d9);z-index:5;padding:20px;text-align:center}#panel{width:min(480px,100%);max-height:94dvh;overflow:auto;background:#15241be8;border:2px solid #a5d08055;border-radius:25px;padding:24px;box-shadow:0 20px 70px #0009}h1{font-size:clamp(30px,7vw,50px);line-height:1;margin:10px 0;color:#f9d875;text-shadow:0 3px #62451e}h2{margin:8px 0 18px}.mascot{font-size:72px;filter:drop-shadow(0 8px 7px #0008)}p{opacity:.88;line-height:1.5}.btn{display:block;width:100%;margin:12px 0;padding:16px 12px;border:0;border-radius:14px;background:#f0c95d;color:#202215;font-size:19px;font-weight:900;cursor:pointer}.btn.secondary{background:#294d35;color:#fff;border:1px solid #729a6b}.btn.zombie{background:#93bd7e}.small{font-size:13px;opacity:.7}#hud{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));right:12px;display:none;pointer-events:none;z-index:2;gap:8px;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:800;text-shadow:0 2px 4px #000}#healthWrap{width:140px;height:15px;background:#4a1919;border:2px solid white;border-radius:10px;overflow:hidden;margin-top:5px}#health{height:100%;width:100%;background:#68d26b}#pause{pointer-events:auto;border:1px solid #fff6;border-radius:9px;background:#172e20c9;color:white;font-weight:800;padding:10px}#controls{display:none;position:absolute;inset:0;z-index:3;pointer-events:none}#stick{position:absolute;bottom:calc(25px + env(safe-area-inset-bottom));left:25px;width:125px;height:125px;border-radius:50%;border:3px solid #ffffff77;background:#ffffff24;pointer-events:auto;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:45px;height:45px;border-radius:50%;background:#ffffffad}#actions{position:absolute;right:15px;bottom:calc(23px + env(safe-area-inset-bottom));display:flex;align-items:end;gap:9px;pointer-events:auto}.action{border:2px solid #ffffff80;color:white;border-radius:50%;background:#c65c32c9;font-weight:900;width:85px;height:85px;touch-action:none}.action.smallbtn{width:65px;height:65px;background:#365e43db;font-size:12px}#lookTip{position:absolute;bottom:calc(122px + env(safe-area-inset-bottom));right:15px;color:#fff9;font-size:12px}#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:25px;text-shadow:0 3px 5px black;pointer-events:none;z-index:2;white-space:nowrap} @media(min-width:850px){#stick{opacity:.5}#lookTip{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><div><span id="modeLabel">HUNT</span> · SCORE <span id="score">0</span><div id="hpLabel" style="display:none">HEALTH <span id="hpText">100</span><div id="healthWrap"><div id="health"></div></div></div></div><div style="text-align:right"><button id="pause">Ⅱ MENU</button><div style="margin-top:7px">WEAPON: <span id="weapon">BLASTER</span></div><div id="waveLabel"></div></div></div><div id="banner"></div><div id="controls"><div id="stick"><div id="nub"></div></div><div id="lookTip">DRAG RIGHT SIDE TO AIM</div><div id="actions"><button id="swap" class="action smallbtn">SWAP</button><button id="fire" class="action">FIRE</button></div></div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),controls=document.getElementById('controls');let W=0,H=0,dpr=1,mode='hunt',screen='menu',score=0,hp=100,wave=1,kills=0,elapsed=0,spawnClock=0,shootClock=0,flash=0,shake=0,entities=[],particles=[],trees=[],keys={},joystick={x:0,y:0},pointer={x:0,y:0},fireHeld=false,weaponIndex=0,player={x:0,y:0,angle:0},last=0;const weapons=['BLASTER','AXE','SNIPER','SHOTGUN'];function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nugget(x,y,zombie=false){return {x,y,zombie,r:17,speed:zombie?rand(37,65):rand(22,38),hp:zombie?2:1,phase:rand(0,7),angle:rand(-Math.PI,Math.PI),turn:rand(.4,2),attack:0}}function resetWorld(){trees=[];for(let i=0;i<110;i++){let x=rand(-1800,1800),y=rand(-1800,1800);if(Math.hypot(x,y)<160)continue;trees.push({x,y,r:rand(17,39),tone:Math.random()})}}function spawn(){let a=rand(0,Math.PI*2),r=rand(380,680);entities.push(nugget(player.x+Math.cos(a)*r,player.y+Math.sin(a)*r,mode==='zombie'))}function start(m){mode=m;screen='playing';score=0;hp=100;wave=1;kills=0;elapsed=0;spawnClock=0;shootClock=0;player={x:0,y:0,angle:0};weaponIndex=m==='zombie'?3:0;entities=[];particles=[];resetWorld();for(let i=0;i<(m==='zombie'?7:15);i++)spawn();overlay.style.display='none';hud.style.display='flex';controls.style.display='block';document.getElementById('hpLabel').style.display=m==='zombie'?'block':'none';document.getElementById('modeLabel').textContent=m==='zombie'?'ZOMBIE SURVIVAL':'ORIGINAL HUNT';updateHud()}function showMenu(){screen='menu';overlay.style.display='grid';hud.style.display='none';controls.style.display='none';fireHeld=false;panel.innerHTML='<div class="mascot">🍗</div><h1>PRANUGGET<br>HUNT V2</h1><p>Two modes. One legendary nugget.</p><button class="btn" id="playBtn">▶ PLAY</button><p class="small">Touchscreen ready · Best in landscape</p>';document.getElementById('playBtn').onclick=showModes}function showModes(){screen='modes';overlay.style.display='grid';panel.innerHTML='<h2>CHOOSE YOUR MODE</h2><div class="mascot">🌲</div><button class="btn" id="original">🎯 ORIGINAL HUNT</button><p>Explore the forest and hunt wandering Pranuggets. Score as many points as you can!</p><button class="btn zombie" id="zombies">🧟 ZOMBIE SURVIVAL</button><p>They chase you! Survive waves, protect your health and blast groups with the shotgun.</p><button class="btn secondary" id="back">← BACK</button>';document.getElementById('original').onclick=()=>start('hunt');document.getElementById('zombies').onclick=()=>start('zombie');document.getElementById('back').onclick=showMenu}function pause(){if(screen!=='playing')return;screen='paused';fireHeld=false;overlay.style.display='grid';panel.innerHTML='<h2>PAUSED</h2><p>Score: '+score+' · '+(mode==='zombie'?'Wave '+wave:'Original Hunt')+'</p><button class="btn" id="resume">▶ RESUME</button><button class="btn secondary" id="main">MAIN MENU</button>';document.getElementById('resume').onclick=()=>{screen='playing';overlay.style.display='none'};document.getElementById('main').onclick=showMenu}function gameOver(){screen='over';fireHeld=false;overlay.style.display='grid';panel.innerHTML='<div class="mascot">🧟</div><h2>GAME OVER</h2><p>Score: <b>'+score+'</b><br>Reached wave: <b>'+wave+'</b></p><button class="btn" id="again">↻ TRY AGAIN</button><button class="btn secondary" id="main">MAIN MENU</button>';document.getElementById('again').onclick=()=>start(mode);document.getElementById('main').onclick=showMenu}function updateHud(){document.getElementById('score').textContent=score;document.getElementById('hpText').textContent=Math.ceil(hp);document.getElementById('health').style.width=hp+'%';document.getElementById('weapon').textContent=weapons[weaponIndex];document.getElementById('waveLabel').textContent=mode==='zombie'?'WAVE '+wave+' · '+entities.length+' LEFT':''}function swap(){weaponIndex=(weaponIndex+1)%4;updateHud()}function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-100,100),life:rand(.2,.55),color})}function shoot(){if(screen!=='playing'||shootClock>0)return;let type=weapons[weaponIndex],range=type==='AXE'?68:type==='SHOTGUN'?230:type==='SNIPER'?850:530,spread=type==='SHOTGUN'?.48:type==='AXE'?1.1:type==='SNIPER'?.045:.13,damage=type==='SNIPER'?3:type==='AXE'?2:1;shootClock=type==='SHOTGUN'?.65:type==='SNIPER'?.85:type==='AXE'?.35:.23;flash=.13;shake=type==='SHOTGUN'?8:3;let hits=[];for(let e of entities){let d=dist(player,e),a=Math.atan2(e.y-player.y,e.x-player.x),delta=Math.atan2(Math.sin(a-player.angle),Math.cos(a-player.angle));if(d<range&&Math.abs(delta)<spread+(e.r/d)){hits.push({e,d})}}hits.sort((a,b)=>a.d-b.d);if(type!=='SHOTGUN'&&type!=='AXE')hits=hits.slice(0,1);for(let {e} of hits){e.hp-=damage;burst(e.x,e.y,e.zombie?'#9bdc66':'#f5d27b',7);if(e.hp<=0){entities.splice(entities.indexOf(e),1);score+=e.zombie?20:10;kills++}}if(mode==='hunt'&&entities.length<16)spawn();updateHud()}function tick(dt){elapsed+=dt;shootClock=Math.max(0,shootClock-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-28*dt);let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joystick.x,dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joystick.y,len=Math.hypot(dx,dy);if(len>0){dx/=Math.max(1,len);dy/=Math.max(1,len);let speed=keys.Shift?250:190;player.x+=dx*speed*dt;player.y+=dy*speed*dt}if(fireHeld)shoot();spawnClock+=dt;if(mode==='zombie'){let targetWave=1+Math.floor(kills/12);if(targetWave>wave){wave=targetWave;document.getElementById('banner').textContent='WAVE '+wave;setTimeout(()=>{if(document.getElementById('banner').textContent==='WAVE '+wave)document.getElementById('banner').textContent=''},1300)}if(spawnClock>Math.max(.65,2.3-wave*.15)&&entities.length<Math.min(12+wave*3,36)){spawn();spawnClock=0}}else if(spawnClock>1.6&&entities.length<16){spawn();spawnClock=0}for(let e of entities){e.phase+=dt;if(e.zombie){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;e.attack-=dt;if(dist(e,player)<31&&e.attack<=0){hp=Math.max(0,hp-12);e.attack=.75;shake=10;burst(player.x,player.y,'#e45b5b',10);if(hp<=0){updateHud();gameOver();break}}}else{e.turn-=dt;if(e.turn<0){e.angle+=rand(-1.5,1.5);e.turn=rand(.7,2.5)}let away=Math.atan2(e.y-player.y,e.x-player.x);if(dist(e,player)<170)e.angle=away;e.x+=Math.cos(e.angle)*e.speed*dt;e.y+=Math.sin(e.angle)*e.speed*dt}if(dist(e,player)>1100){e.x=player.x+rand(-500,500);e.y=player.y+rand(-500,500)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}updateHud()}function drawNugget(x,y,e){g.save();g.translate(x,y+Math.sin(e.phase*4)*2);g.rotate(Math.sin(e.phase*2)*.12);g.fillStyle='#0005';g.beginPath();g.ellipse(0,18,18,7,0,0,7);g.fill();g.fillStyle=e.zombie?'#81ad4a':'#d38b31';g.beginPath();g.moveTo(-17,-9);g.quadraticCurveTo(-21,-21,-5,-20);g.quadraticCurveTo(8,-26,16,-15);g.quadraticCurveTo(24,-4,18,10);g.quadraticCurveTo(7,23,-10,17);g.quadraticCurveTo(-23,7,-17,-9);g.fill();g.fillStyle=e.zombie?'#b7db6d':'#f6c86d';g.beginPath();g.ellipse(-2,-3,14,15,-.2,0,7);g.fill();g.fillStyle=e.zombie?'#ed4d56':'#222';g.beginPath();g.arc(-7,-5,2.8,0,7);g.arc(7,-5,2.8,0,7);g.fill();g.strokeStyle=e.zombie?'#563f36':'#7b4a22';g.lineWidth=2;g.beginPath();g.arc(0,2,5,0,Math.PI);g.stroke();if(e.zombie){g.strokeStyle='#415d29';g.beginPath();g.moveTo(-12,6);g.lineTo(-17,11);g.moveTo(11,5);g.lineTo(16,9);g.stroke()}g.restore()}function render(){g.clearRect(0,0,W,H);g.save();g.translate(rand(-shake,shake),rand(-shake,shake));g.fillStyle=mode==='zombie'?'#172a20':'#32613a';g.fillRect(-20,-20,W+40,H+40);let cx=W/2-player.x,cy=H/2-player.y;g.save();g.translate(cx,cy);let left=player.x-W/2-80,top=player.y-H/2-80;g.strokeStyle='#ffffff08';g.lineWidth=1;for(let x=Math.floor(left/80)*80;x<left+W+180;x+=80){g.beginPath();g.moveTo(x,top);g.lineTo(x,top+H+180);g.stroke()}for(let y=Math.floor(top/80)*80;y<top+H+180;y+=80){g.beginPath();g.moveTo(left,y);g.lineTo(left+W+180,y);g.stroke()}for(let t of trees){if(Math.abs(t.x-player.x)>W/2+70||Math.abs(t.y-player.y)>H/2+70)continue;g.fillStyle='#132a1c';g.beginPath();g.arc(t.x+5,t.y+7,t.r+3,0,7);g.fill();g.fillStyle=t.tone>.5?'#214e30':'#285b35';g.beginPath();g.arc(t.x,t.y,t.r,0,7);g.fill();g.fillStyle='#ffffff0a';g.beginPath();g.arc(t.x-6,t.y-7,t.r*.48,0,7);g.fill()}for(let e of entities){if(Math.abs(e.x-player.x)<W/2+50&&Math.abs(e.y-player.y)<H/2+50)drawNugget(e.x,e.y,e)}for(let p of particles){g.fillStyle=p.color;g.globalAlpha=Math.min(1,p.life*2);g.fillRect(p.x-3,p.y-3,6,6)}g.globalAlpha=1;g.save();g.translate(player.x,player.y);g.rotate(player.angle);g.fillStyle='#07130b88';g.beginPath();g.ellipse(0,7,18,17,0,0,7);g.fill();g.fillStyle='#75c7e4';g.beginPath();g.arc(0,0,15,0,7);g.fill();g.fillStyle='#e8e8e8';g.fillRect(8,-5,weapons[weaponIndex]==='SHOTGUN'?33:24,weapons[weaponIndex]==='SHOTGUN'?10:7);if(flash>0){g.fillStyle='#ffdf7a';g.beginPath();g.arc(44,0,8+flash*50,0,7);g.fill()}g.restore();g.restore();g.restore();g.strokeStyle='#ffffff99';g.lineWidth=2;g.beginPath();g.arc(W/2,H/2,27,0,7);g.stroke();g.fillStyle='#ffffff99';g.font='12px system-ui';if(screen==='playing'&&mode==='hunt')g.fillText('Hunt the wandering nuggets!',12,H-12)}function loop(ts){let dt=Math.min(.04,(ts-last)/1000||.016);last=ts;if(screen==='playing')tick(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function aim(x,y){player.angle=Math.atan2(y-H/2,x-W/2)}c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&screen==='playing')aim(e.clientX,e.clientY)});c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&screen==='playing'){aim(e.clientX,e.clientY);fireHeld=true}});addEventListener('pointerup',e=>{if(e.pointerType==='mouse')fireHeld=false});let lookId=null;let lookStart=null;c.addEventListener('touchstart',e=>{for(let t of e.changedTouches){if(t.clientX>W*.35){lookId=t.identifier;lookStart={x:t.clientX,y:t.clientY}}}},{passive:false});c.addEventListener('touchmove',e=>{for(let t of e.changedTouches){if(t.identifier===lookId&&lookStart){let dx=t.clientX-lookStart.x,dy=t.clientY-lookStart.y;player.angle+=dx*.013;lookStart={x:t.clientX,y:t.clientY}}}},{passive:false});c.addEventListener('touchend',e=>{for(let t of e.changedTouches)if(t.identifier===lookId)lookId=null});let stick=document.getElementById('stick'),nub=document.getElementById('nub');function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),scale=Math.min(1,47/Math.max(1,l));joystick.x=x*scale/47;joystick.y=y*scale/47;nub.style.transform='translate('+x*scale+'px,'+y*scale+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)});function stopStick(){joystick={x:0,y:0};nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);let fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});for(let ev of ['pointerup','pointercancel','pointerleave'])fire.addEventListener(ev,()=>fireHeld=false);document.getElementById('swap').onclick=swap;document.getElementById('pause').onclick=pause;addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='Escape')pause();if(e.key===' '){fireHeld=true;shoot()}if('1234'.includes(e.key)){weaponIndex=Number(e.key)-1;updateHud()}if(e.key==='q'||e.key==='Q')swap()});addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' ')fireHeld=false});addEventListener('blur',()=>{keys={};fireHeld=false;stopStick()});showMenu()})();
</script></body></html>
